<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace">
  <style>
    .l{opacity:0;animation:in .01s forwards}
    .l1{animation-delay:.3s}.l2{animation-delay:.9s}.l3{animation-delay:1.5s}.l4{animation-delay:2.1s}.l5{animation-delay:2.7s}.l6{animation-delay:3.3s}
    .name{opacity:0;animation:up .8s 3.9s forwards}
    .role{opacity:0;animation:up .8s 4.4s forwards}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes in{to{opacity:1}}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="1200" height="340" rx="14" fill="#0b0f14"/>
  <rect width="1200" height="36" rx="14" fill="#141a22"/>
  <rect y="22" width="1200" height="14" fill="#141a22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/><circle cx="44" cy="18" r="6" fill="#febc2e"/><circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="600" y="23" fill="#5c6773" font-size="13" text-anchor="middle">brayan@huancayo: ~</text>

  <g font-size="15">
    <text class="l l1" x="32" y="74" fill="#5c6773">$ <tspan fill="#e6edf3">whoami --stack</tspan></text>
    <text class="l l2" x="32" y="100" fill="#7ee787">✔ <tspan fill="#9da7b3">móvil</tspan>      <tspan fill="#5c6773">flutter · dart</tspan></text>
    <text class="l l3" x="32" y="126" fill="#7ee787">✔ <tspan fill="#9da7b3">web</tspan>        <tspan fill="#5c6773">next.js · react · typescript</tspan></text>
    <text class="l l4" x="32" y="152" fill="#7ee787">✔ <tspan fill="#9da7b3">backend</tspan>    <tspan fill="#5c6773">nestjs · laravel · node</tspan></text>
    <text class="l l5" x="32" y="178" fill="#7ee787">✔ <tspan fill="#9da7b3">datos</tspan>      <tspan fill="#5c6773">postgresql · mysql · docker</tspan></text>
    <text class="l l6" x="32" y="204" fill="#5c6773">listo para construir<tspan class="cur" fill="#e6edf3"> ▋</tspan></text>
  </g>

  <line x1="32" y1="232" x2="1168" y2="232" stroke="#1f2730"/>
  <text class="name" x="32" y="284" fill="#e6edf3" font-size="40" font-weight="700" letter-spacing="-1">Jhon Brayan Huincho Quispe</text>
  <text class="role" x="32" y="316" fill="#f0883e" font-size="16">full stack · construyo software que la gente usa para trabajar</text>
</svg>
